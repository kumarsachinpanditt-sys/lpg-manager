name: Build Bharat Gas Care Agency Expo APK

on:
  push:
    branches: [ "expo-erp-foundation" ]
    paths:
      - "mobile-expo/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-expo
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-expo/package.json

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo dependencies
        run: npm install

      - name: Generate native Android project from Expo app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        working-directory: mobile-expo/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-gas-care-agency-expo-debug-apk
          path: mobile-expo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Expo Android APK
on:
  push:
    branches: [expo-erp-foundation]
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/expo-android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install dependencies
        working-directory: mobile-expo
        run: npm install
      - name: Generate Android project
        working-directory: mobile-expo
        run: NODE_OPTIONS=--import=tsx npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: mobile-expo/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bharat-gas-care-agency-debug-apk
          path: mobile-expo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
